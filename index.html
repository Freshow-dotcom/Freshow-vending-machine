<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshow - Smart Beverage Machine</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.header {
    background: #1b1b1b;
    color: white;
    text-align: center;
    padding: 25px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    opacity: 0.8;
    margin-top: 5px;
}

.screen {
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.info {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.info h2 {
    font-size: 20px;
    color: #333;
}

.price {
    background: #28a745;
    color: white;
    padding: 8px 15px;
    border-radius: 25px;
    font-weight: bold;
}

.select-btn {
    width: calc(100% - 30px);
    margin: 0 15px 15px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #0078ff;
    color: white;
    cursor: pointer;
}

.select-btn:hover {
    background: #005fd1;
}

#payment-screen,
#qr-screen {
    display: none;
}

.selected-box {
    background: #f4f4f4;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.pay-btn {
    width: 100%;
    border: none;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.esewa {
    background: #60bb46;
}

.khalti {
    background: #5c2d91;
}

.back-btn {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    cursor: pointer;
}

.qr-section {
    text-align: center;
}

.qr-section h2 {
    margin-bottom: 10px;
}

.qr-section p {
    margin: 10px 0;
    color: #555;
}

.qr-section img {
    width: 230px;
    height: 230px;
    object-fit: contain;
    margin: 15px auto;
    padding: 10px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    display: block;
}

.qr-amount {
    font-size: 20px;
    font-weight: bold;
    color: #28a745;
}

.payment-note {
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin: 15px 0;
}

.success {
    margin-top: 15px;
    text-align: center;
    color: green;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>☕ Freshow</h1>
        <p>Select your beverage</p>
    </div>

    <!-- MENU SCREEN -->

    <div id="menu-screen" class="screen">

        <div class="card">

            <img src="BlackCoffee.jpg" alt="Black Coffee">

            <div class="info">
                <h2>Black Coffee</h2>
                <div class="price">Rs. 40</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Black Coffee',40)">
                Select
            </button>

        </div>

        <div class="card">

            <img src="MilkTea.png" alt="Milk Tea">

            <div class="info">
                <h2>Milk Tea</h2>
                <div class="price">Rs. 50</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Milk Tea',50)">
                Select
            </button>

        </div>

        <div class="card">

            <img src="HotWater.jpg" alt="Hot Water">

            <div class="info">
                <h2>Hot Water</h2>
                <div class="price">Rs. 20</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Hot Water',20)">
                Select
            </button>

        </div>

    </div>


    <!-- PAYMENT SCREEN -->

    <div id="payment-screen" class="screen">

        <div class="selected-box">
            <h3 id="itemName"></h3>
            <p id="itemPrice"></p>
        </div>

        <button class="pay-btn esewa"
            onclick="showQR('eSewa')">
            Pay with eSewa
        </button>

        <button class="pay-btn khalti"
            onclick="showQR('Khalti')">
            Pay with Khalti
        </button>

        <button class="back-btn" onclick="goBack()">
            Back to Menu
        </button>

    </div>


    <!-- QR CODE SCREEN -->

    <div id="qr-screen" class="screen">

        <div class="qr-section">

            <h2 id="qr-title"></h2>

            <p>Scan this QR code using your payment app.</p>

            <img id="qr-image" src="" alt="Payment QR Code">

            <p class="qr-amount" id="qr-amount"></p>

            <div class="payment-note">
                Please complete your payment using the displayed QR code.
                This is a demo display; payment is not automatically verified.
            </div>

            <button class="back-btn" onclick="backToPayment()">
                Back to Payment Options
            </button>

        </div>

    </div>

</div>


<script>

let selectedItem = "";
let selectedPrice = 0;


// SELECT BEVERAGE

function selectItem(item, price) {

    selectedItem = item;
    selectedPrice = price;

    document.getElementById("menu-screen").style.display = "none";
    document.getElementById("payment-screen").style.display = "block";
    document.getElementById("qr-screen").style.display = "none";

    document.getElementById("itemName").innerText =
        "Selected: " + item;

    document.getElementById("itemPrice").innerText =
        "Amount: Rs. " + price;

}


// SHOW QR CODE

function showQR(method) {

    let qrImage = document.getElementById("qr-image");

    document.getElementById("payment-screen").style.display = "none";
    document.getElementById("qr-screen").style.display = "block";

    document.getElementById("qr-title").innerText =
        method + " QR Payment";

    document.getElementById("qr-amount").innerText =
        "Please pay Rs. " + selectedPrice;


    if (method === "eSewa") {

        qrImage.src = "esewaqr.jpeg";

    }

    else if (method === "Khalti") {

        qrImage.src = "Khaltiqr.jpeg";

    }

}


// BACK TO PAYMENT OPTIONS

function backToPayment() {

    document.getElementById("qr-screen").style.display = "none";
    document.getElementById("payment-screen").style.display = "block";

}


// BACK TO MENU

function goBack() {

    document.getElementById("payment-screen").style.display = "none";
    document.getElementById("menu-screen").style.display = "block";

}

</script>

</body>
</html>
