
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshow - Smart Beverage Machine</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.header {
    background: #1b1b1b;
    color: white;
    text-align: center;
    padding: 25px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    opacity: 0.8;
    margin-top: 5px;
}

.screen {
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.info {
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.info h2 {
    font-size: 20px;
    color: #333;
}

.price {
    background: #28a745;
    color: white;
    padding: 8px 15px;
    border-radius: 25px;
    font-weight: bold;
}

.select-btn {
    width: calc(100% - 30px);
    margin: 0 15px 15px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    background: #0078ff;
    color: white;
    cursor: pointer;
}

.select-btn:hover {
    background: #005fd1;
}

#payment-screen,
#qr-screen {
    display: none;
}

.selected-box {
    background: #f4f4f4;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.pay-btn {
    width: 100%;
    border: none;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.esewa {
    background: #60bb46;
}

.khalti {
    background: #5c2d91;
}

.back-btn {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    cursor: pointer;
}

.qr-section {
    text-align: center;
}

.qr-section h2 {
    margin-bottom: 10px;
}

.qr-section p {
    margin: 10px 0;
    color: #555;
}

.qr-section img {
    width: 230px;
    height: 230px;
    object-fit: contain;
    margin: 15px auto;
    padding: 10px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    display: block;
}

.qr-amount {
    font-size: 20px;
    font-weight: bold;
    color: #28a745;
}

.payment-note {
    background: #fff3cd;
    color: #856404;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    margin: 15px 0;
}

.success {
    margin-top: 15px;
    text-align: center;
    color: green;
    font-weight: bold;
}

/* NEW ORDER BUTTON */

.complete-btn {
    width: 100%;
    padding: 14px;
    background: #0078ff;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.complete-btn:hover {
    background: #005fd1;
}

.complete-btn:disabled {
    background: #999;
    cursor: not-allowed;
}

/* ORDER STATUS */

.order-status {
    display: none;
    padding: 15px;
    border-radius: 12px;
    margin: 15px 0;
    font-weight: bold;
    text-align: center;
}

.pending-status {
    display: block;
    background: #fff3cd;
    color: #856404;
}

.success-status {
    display: block;
    background: #d4edda;
    color: #155724;
}

.error-status {
    display: block;
    background: #f8d7da;
    color: #721c24;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>☕ Freshow</h1>
        <p>Select your beverage</p>
    </div>

    <!-- MENU SCREEN -->

    <div id="menu-screen" class="screen">

        <div class="card">

            <img src="BlackCoffee.jpg" alt="Black Coffee">

            <div class="info">
                <h2>Black Coffee</h2>
                <div class="price">Rs. 40</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Black Coffee',40)">
                Select
            </button>

        </div>

        <div class="card">

            <img src="MilkTea.png" alt="Milk Tea">

            <div class="info">
                <h2>Milk Tea</h2>
                <div class="price">Rs. 50</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Milk Tea',50)">
                Select
            </button>

        </div>

        <div class="card">

            <img src="HotWater.jpg" alt="Hot Water">

            <div class="info">
                <h2>Hot Water</h2>
                <div class="price">Rs. 20</div>
            </div>

            <button class="select-btn"
                onclick="selectItem('Hot Water',20)">
                Select
            </button>

        </div>

    </div>


    <!-- PAYMENT SCREEN -->

    <div id="payment-screen" class="screen">

        <div class="selected-box">
            <h3 id="itemName"></h3>
            <p id="itemPrice"></p>
        </div>

        <button class="pay-btn esewa"
            onclick="showQR('eSewa')">
            Pay with eSewa
        </button>

        <button class="pay-btn khalti"
            onclick="showQR('Khalti')">
            Pay with Khalti
        </button>

        <button class="back-btn" onclick="goBack()">
            Back to Menu
        </button>

    </div>


    <!-- QR CODE SCREEN -->

    <div id="qr-screen" class="screen">

        <div class="qr-section">

            <h2 id="qr-title"></h2>

            <p>Scan this QR code using your payment app.</p>

            <img id="qr-image" src="" alt="Payment QR Code">

            <p class="qr-amount" id="qr-amount"></p>

            <div class="payment-note">
                Please complete your payment using the displayed QR code.
                After paying, click the button below to submit your order.
            </div>

            <!-- CUSTOMER CONFIRMATION BUTTON -->

            <button
                id="complete-btn"
                class="complete-btn"
                onclick="submitOrder()">

                I've Completed Payment

            </button>

            <!-- ORDER STATUS MESSAGE -->

            <div id="order-status" class="order-status"></div>

            <button
                id="qr-back-btn"
                class="back-btn"
                onclick="backToPayment()">

                Back to Payment Options

            </button>

        </div>

    </div>

</div>


<script>

// BACKEND URL

const API = "https://freshow-backend.onrender.com";

let selectedItem = "";
let selectedPrice = 0;
let selectedMethod = "";

let currentOrderId = null;
let statusInterval = null;
let orderSubmitting = false;


// SELECT BEVERAGE

function selectItem(item, price) {

    selectedItem = item;
    selectedPrice = price;

    document.getElementById("menu-screen").style.display = "none";
    document.getElementById("payment-screen").style.display = "block";
    document.getElementById("qr-screen").style.display = "none";

    document.getElementById("itemName").innerText =
        "Selected: " + item;

    document.getElementById("itemPrice").innerText =
        "Amount: Rs. " + price;

}


// SHOW QR CODE

function showQR(method) {

    selectedMethod = method;

    let qrImage = document.getElementById("qr-image");

    document.getElementById("payment-screen").style.display = "none";
    document.getElementById("qr-screen").style.display = "block";

    document.getElementById("qr-title").innerText =
        method + " QR Payment";

    document.getElementById("qr-amount").innerText =
        "Please pay Rs. " + selectedPrice;


    // YOUR ORIGINAL QR CODES - UNCHANGED

    if (method === "eSewa") {

        qrImage.src = "esewaqr.jpeg";

    }

    else if (method === "Khalti") {

        qrImage.src = "Khaltiqr.jpeg";

    }

    // RESET ORDER DISPLAY

    currentOrderId = null;
    orderSubmitting = false;

    if (statusInterval) {
        clearInterval(statusInterval);
        statusInterval = null;
    }

    document.getElementById("order-status").className =
        "order-status";

    document.getElementById("order-status").innerText = "";

    document.getElementById("complete-btn").disabled = false;
    document.getElementById("complete-btn").style.display = "block";

    document.getElementById("qr-back-btn").style.display = "block";

}


// SUBMIT CUSTOMER ORDER

async function submitOrder() {

    if (orderSubmitting || currentOrderId !== null) {
        return;
    }

    orderSubmitting = true;

    const button = document.getElementById("complete-btn");

    button.disabled = true;
    button.innerText = "Submitting Order...";

    try {

        const response = await fetch(API + "/create-order", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                item: selectedItem,

                amount: selectedPrice,

                paymentMethod: selectedMethod

            })

        });

        if (!response.ok) {
            throw new Error("Order submission failed");
        }

        const order = await response.json();

        currentOrderId = order.id;

        // SHOW PENDING MESSAGE

        showStatus(
            "PENDING",
            "⏳ Your order has been submitted! Waiting for admin approval."
        );

        button.innerText = "Order Submitted";

        // PREVENT CUSTOMER FROM SUBMITTING DUPLICATE ORDER

        button.style.display = "none";

        document.getElementById("qr-back-btn").style.display = "none";

        // CHECK ADMIN APPROVAL EVERY 5 SECONDS

        checkOrderStatus();

        statusInterval = setInterval(checkOrderStatus, 5000);

    }

    catch (error) {

        console.error(error);

        showStatus(
            "ERROR",
            "❌ Could not submit your order. Please try again."
        );

        button.disabled = false;
        button.innerText = "Try Again";

        orderSubmitting = false;

    }

}


// DISPLAY ORDER STATUS

function showStatus(type, message) {

    const statusBox = document.getElementById("order-status");

    statusBox.style.display = "block";

    statusBox.className = "order-status";

    if (type === "PENDING") {

        statusBox.classList.add("pending-status");

    }

    else if (type === "SUCCESS") {

        statusBox.classList.add("success-status");

    }

    else {

        statusBox.classList.add("error-status");

    }

    statusBox.innerText = message;

}


// CHECK ADMIN APPROVAL

async function checkOrderStatus() {

    if (currentOrderId === null) {
        return;
    }

    try {

        const response = await fetch(API + "/orders");

        if (!response.ok) {
            throw new Error("Could not check order status");
        }

        const orders = await response.json();

        const myOrder = orders.find(
            order => String(order.id) === String(currentOrderId)
        );

        if (!myOrder) {
            return;
        }

        // ADMIN APPROVED THE ORDER

        if (myOrder.status === "PAID" ||
            myOrder.status === "SUCCESS") {

            showStatus(
                "SUCCESS",
                "✅ SUCCESS! Your payment has been approved. Your order is confirmed!"
            );

            clearInterval(statusInterval);
            statusInterval = null;

        }

        // ORDER IS STILL WAITING

        else if (myOrder.status === "PENDING") {

            showStatus(
                "PENDING",
                "⏳ Payment submitted. Waiting for admin approval..."
            );

        }

    }

    catch (error) {

        console.error("Status check error:", error);

        // Keep the pending state and retry on the next check.

    }

}


// BACK TO PAYMENT OPTIONS

function backToPayment() {

    if (currentOrderId !== null) {
        return;
    }

    document.getElementById("qr-screen").style.display = "none";
    document.getElementById("payment-screen").style.display = "block";

}


// BACK TO MENU

function goBack() {

    document.getElementById("payment-screen").style.display = "none";
    document.getElementById("menu-screen").style.display = "block";

}

</script>

</body>
</html>
