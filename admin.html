
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freshow Admin Panel</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: #1f1c2c;
    padding: 20px;
    margin: 0;
}

h1 {
    color: white;
    text-align: center;
}

.subtitle {
    color: #ccc;
    text-align: center;
    margin-bottom: 25px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.order {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.order h3 {
    margin-top: 0;
    color: #222;
}

.pending {
    color: orange;
    font-weight: bold;
}

.paid {
    color: green;
    font-weight: bold;
}

button {
    background: #28a745;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #1f8a39;
}

button:disabled {
    background: gray;
    cursor: not-allowed;
}

.refresh {
    display: block;
    margin: 20px auto;
    background: #0078ff;
}

.message {
    color: white;
    text-align: center;
    margin: 20px;
}

</style>

</head>

<body>

<div class="container">

<h1>☕ Freshow Admin Panel</h1>

<p class="subtitle">Manage customer beverage orders</p>

<button class="refresh" onclick="loadOrders()">
    Refresh Orders
</button>

<div id="orders" class="message">
    Loading orders...
</div>

</div>

<script>

const API = "https://freshow-backend.onrender.com";


// LOAD ORDERS

async function loadOrders() {

    const container = document.getElementById("orders");

    try {

        const response = await fetch(API + "/orders");

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const orders = await response.json();

        if (!Array.isArray(orders)) {
            throw new Error("Invalid orders response");
        }

        if (orders.length === 0) {
            container.innerHTML = "No orders received yet.";
            container.className = "message";
            return;
        }

        let html = "";

        orders.reverse().forEach(order => {

            html += `

            <div class="order">

                <h3>☕ ${order.item}</h3>

                <p>
                    <strong>Order ID:</strong>
                    ${order.id}
                </p>

                <p>
                    <strong>Amount:</strong>
                    Rs. ${order.amount}
                </p>

                <p>
                    <strong>Status:</strong>

                    <span class="${order.status === 'PAID' ? 'paid' : 'pending'}">
                        ${order.status}
                    </span>

                </p>

                ${
                    order.status === "PENDING"
                    ?
                    `<button onclick="approveOrder('${order.id}', this)">
                        Approve Order
                    </button>`
                    :
                    `<p class="paid">✓ Order Approved</p>`
                }

            </div>

            `;

        });

        container.className = "";
        container.innerHTML = html;

    }

    catch (error) {

        console.error(error);

        container.className = "message";

        container.innerHTML =
            "Unable to load orders. Please refresh.";

    }

}


// APPROVE ORDER

async function approveOrder(id, button) {

    const confirmApproval = confirm(
        "Are you sure you want to approve this order?"
    );

    if (!confirmApproval) return;

    button.disabled = true;
    button.innerText = "Approving...";

    try {

        const response = await fetch(
            API + "/approve/" + encodeURIComponent(id),
            {
                method: "POST"
            }
        );

        if (!response.ok) {
            throw new Error("Approval failed");
        }

        const result = await response.json();

        alert("Order approved successfully!");

        loadOrders();

    }

    catch (error) {

        console.error(error);

        alert("Could not approve order. Please try again.");

        button.disabled = false;
        button.innerText = "Approve Order";

    }

}


// AUTOMATIC REFRESH EVERY 5 SECONDS

loadOrders();

setInterval(loadOrders, 5000);

</script>

</body>
</html>
